<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Learn - MoneySprout</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="page" class="hidden">
    <h1>Learn</h1>
    <p class="muted">Short lessons on how the stock market works. Investing always has risk, and nobody can promise you will make money.</p>

    <div class="card">
      <h2>Lessons</h2>
      <div id="lessons"></div>
    </div>

    <div class="grid two" style="margin-top:16px">
      <div class="card">
        <h2>Glossary</h2>
        <div class="field"><input type="text" id="gsearch" placeholder="Search a word"></div>
        <div id="glossary"></div>
      </div>
      <div class="card">
        <h2>Quick quiz</h2>
        <div id="quiz"></div>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/learn.js"></script>
</body>
</html>
