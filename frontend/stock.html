<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Company - MoneySprout</title>
  <script src="js/theme.js?v=8"></script>
  <link rel="stylesheet" href="css/style.css?v=8">
</head>
<body>
  <div id="page" class="hidden">
    <div id="banner"></div>

    <div class="stock-head">
      <div class="name" id="head"></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn light" id="watchBtn">Add to watchlist</button>
        <a class="btn light" id="noteLink" href="notes.html">Write a note</a>
        <button class="btn" id="buyBtn">Buy</button>
        <button class="btn light" id="sellBtn">Sell</button>
      </div>
    </div>

    <div class="card">
      <div class="ranges" id="ranges"></div>

      <div class="predict-bar" id="predictBar"></div>

      <div class="tools" id="tools"></div>

      <div class="chart-box">
        <canvas id="chart"></canvas>
        <div class="chart-msg" id="chartMsg"><div class="skel" style="width:100%;height:100%"></div></div>
      </div>
      <p class="muted small" style="margin:8px 0 0">
        Drag to pan, scroll to zoom. Bars at the bottom are trading volume.
        <span id="saveState"></span>
      </p>
      <div class="predict-info hidden" id="predictInfo"></div>
    </div>

    <div class="card block-gap">
      <h2 id="aboutTitle">About</h2>
      <p id="desc"></p>
      <table>
        <tbody id="facts"></tbody>
      </table>
    </div>
  </div>

  <div id="modalHost"></div>

  <script src="js/app.js?v=8"></script>
  <script src="js/chart.js?v=8"></script>
  <script src="js/stock.js?v=8"></script>
</body>
</html>
