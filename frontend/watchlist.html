<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Watchlist - MoneySprout</title>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="page" class="hidden">
    <h1>Watchlist</h1>
    <p class="muted">Companies you want to keep an eye on. It is saved to your account.</p>
    <div id="banner"></div>

    <div class="card" style="margin-bottom:16px">
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <div style="flex:1;min-width:200px">
          <input type="text" id="addInput" list="companies" placeholder="Add a company by name or ticker">
          <datalist id="companies"></datalist>
        </div>
        <button class="btn" id="addBtn">Add to watchlist</button>
      </div>
    </div>

    <div class="card">
      <div id="list"></div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/watchlist.js"></script>
</body>
</html>
