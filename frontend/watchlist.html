<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Watchlist - MoneySprout</title>
  <script src="js/theme.js?v=10"></script>
  <link rel="stylesheet" href="css/style.css?v=10">
</head>
<body>
  <div id="page" class="hidden">
    <h1>Watchlist</h1>
    <div id="banner"></div>

    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px">
      <div style="flex:1;min-width:200px;max-width:480px">
        <input type="text" id="addInput" list="companies" placeholder="Company name or ticker">
        <datalist id="companies"></datalist>
      </div>
      <button class="btn" id="addBtn">Add</button>
    </div>

    <div class="card">
      <div id="list"></div>
    </div>
  </div>

  <script src="js/app.js?v=10"></script>
  <script src="js/watchlist.js?v=10"></script>
</body>
</html>
