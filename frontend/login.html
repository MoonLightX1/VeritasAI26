<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in - MoneySprout</title>
  <link rel="icon" type="image/png" href="/assets/moneysprout-icon.png">
  <script src="js/theme.js?v=14"></script>
  <link rel="stylesheet" href="css/style.css?v=14">
</head>
<body>
  <div class="pub-nav">
    <a href="/"><img class="auth-logo logo-light" src="/assets/moneysprout.png" width="632" height="575" alt="MoneySprout"><img class="auth-logo logo-dark" src="/assets/moneysprout-dark.png" width="632" height="575" alt="MoneySprout"></a>
    <div class="right-side"><span id="themeSlot"></span></div>
  </div>

  <div class="auth-wrap">
    <div class="card">
      <h1>Welcome back</h1>
      <div id="err" class="banner err hidden"></div>
      <form id="form">
        <div class="field">
          <label for="ident">Username or email</label>
          <input type="text" id="ident" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="pw">Password</label>
          <input type="password" id="pw" autocomplete="current-password" required>
        </div>
        <div class="checkrow">
          <input type="checkbox" id="remember">
          <label for="remember">Keep me logged in for 30 days</label>
        </div>
        <button class="btn block" id="submit" type="submit">Log in</button>
      </form>
      <p class="small muted" style="margin-top:14px;text-align:center">New here? <a href="signup">Make a demo account</a></p>
    </div>
  </div>

  <script src="js/app.js?v=14"></script>
  <script src="js/login.js?v=14"></script>
</body>
</html>
