<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in - MoneySprout</title>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="pub-nav">
    <a class="brand" href="index.html">Money<span>Sprout</span></a>
    <div class="right-side"><span id="themeSlot"></span></div>
  </div>

  <div class="auth-wrap">
    <div class="card">
      <h1>Welcome back</h1>
      <p class="muted">Log in to keep practicing.</p>
      <div id="err" class="banner err hidden"></div>
      <form id="form">
        <div class="field">
          <label for="ident">Username or email</label>
          <input type="text" id="ident" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="pw">Password</label>
          <input type="password" id="pw" autocomplete="current-password" required>
        </div>
        <div class="checkrow">
          <input type="checkbox" id="remember">
          <label for="remember">Keep me logged in for 30 days</label>
        </div>
        <button class="btn block" id="submit" type="submit">Log in</button>
      </form>
      <p class="small muted" style="margin-top:14px;text-align:center">No account yet? <a href="signup.html">Create a demo account</a></p>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
