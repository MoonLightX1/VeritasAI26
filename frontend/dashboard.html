<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard - MoneySprout</title>
  <link rel="icon" type="image/png" href="/assets/moneysprout-icon.png">
  <script src="js/theme.js?v=14"></script>
  <link rel="stylesheet" href="css/style.css?v=14">
</head>
<body>
  <div id="page" class="hidden">
    <div id="banner"></div>

    <div class="summary" id="wallet"></div>

    <div class="grid two block-gap">
      <div class="card">
        <h2>Your watchlist</h2>
        <div id="watch"></div>
      </div>
      <div class="card">
        <h2>Big movers today</h2>
        <div id="trending"></div>
      </div>
    </div>

    <div class="grid two block-gap">
      <div class="card">
        <h2>Your latest trades</h2>
        <div id="activity"></div>
      </div>
      <div class="card">
        <h2>Recently viewed</h2>
        <div id="viewed"></div>
      </div>
    </div>
  </div>

  <script src="js/app.js?v=14"></script>
  <script src="js/dashboard.js?v=14"></script>
</body>
</html>
