<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Portfolio - MoneySprout</title>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="page" class="hidden">
    <h1>My portfolio</h1>
    <p class="muted">Everything here is pretend money. Your results do not predict what would happen with real investing.</p>
    <div id="banner"></div>

    <div class="grid four" id="summary"></div>

    <div class="card" style="margin-top:16px">
      <h2>Your holdings</h2>
      <div class="table-wrap" id="holdings"></div>
    </div>

    <div class="card">
      <h2>Transaction history</h2>
      <div class="table-wrap" id="tx"></div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/portfolio.js"></script>
</body>
</html>
