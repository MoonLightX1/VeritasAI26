<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Explore Stocks - MoneySprout</title>
  <script src="js/theme.js?v=10"></script>
  <link rel="stylesheet" href="css/style.css?v=10">
</head>
<body>
  <div id="page" class="hidden">
    <h1>Find a stock</h1>

    <div id="count" class="muted small" style="margin-bottom:12px"></div>
    <div class="grid three" id="results"></div>
  </div>

  <script src="js/app.js?v=10"></script>
  <script src="js/explore.js?v=10"></script>
</body>
</html>
